services:
  - type: web
    name: scholarguard
    runtime: python
    buildCommand: ./build.sh
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@sawadigitaltech.com
      - key: ADMIN_PASSWORD
        value: Admin@12345
    disk:
      name: scholarguard-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1