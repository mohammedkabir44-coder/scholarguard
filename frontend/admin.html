<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawa Digital Tech Solutions | Admin Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <nav class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-lg"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg></div>
            <h1 class="text-xl font-bold text-slate-800">Sawa Digital Tech Solutions Control Center</h1>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-sm text-slate-500">Logged in as <b id="admin-email" class="text-slate-800"></b></span>
            <button id="logout-btn" class="text-sm font-medium text-red-600 hover:text-red-800 transition">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-8 space-y-8">
        <div id="admin-login" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg border border-slate-100 space-y-6 mt-12">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-slate-800">Administrator Access</h2>
                <p class="text-slate-500 mt-1">Enter your credentials to manage the platform</p>
            </div>
            <input type="email" id="email" placeholder="Admin Email" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <button id="login-btn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow-md">Sign In</button>
            <p id="login-msg" class="text-center text-sm text-red-500 hidden"></p>
        </div>

        <div id="admin-panel" class="hidden space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <p class="text-sm font-medium text-slate-500">Total Customers</p>
                    <p class="text-3xl font-bold text-slate-800 mt-2" id="stat-total">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <p class="text-sm font-medium text-slate-500">Active Accounts</p>
                    <p class="text-3xl font-bold text-green-600 mt-2" id="stat-active">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <p class="text-sm font-medium text-slate-500">Suspended</p>
                    <p class="text-3xl font-bold text-red-600 mt-2" id="stat-suspended">0</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <h3 class="text-lg font-semibold text-slate-800 mb-4">Provision New Customer</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="email" id="new-email" placeholder="Email Address" class="p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="text" id="new-phone" placeholder="Phone Number" class="p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="text" id="new-password" placeholder="Initial Password" class="p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <button id="create-btn" class="bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow-md">Create Account</button>
                </div>
                <p id="create-msg" class="text-sm mt-3 hidden"></p>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-6 border-b border-slate-200 flex justify-between items-center">
                    <h3 class="text-lg font-semibold text-slate-800">Customer Directory</h3>
                    <button onclick="loadUsers()" class="text-sm font-medium text-blue-600 hover:text-blue-800">Refresh List</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-slate-500 uppercase bg-slate-50 tracking-wider">
                            <tr>
                                <th class="px-6 py-4">Customer ID</th>
                                <th class="px-6 py-4">Email Address</th>
                                <th class="px-6 py-4">Phone Number</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table" class="divide-y divide-slate-100">
                            <tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">Loading customers...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API = "https://sawadigitaltech.onrender.com";
        let token = localStorage.getItem("sawa_token");
        const loginSec = document.getElementById("admin-login");
        const panelSec = document.getElementById("admin-panel");

        if (token) showPanel();

        document.getElementById("login-btn").addEventListener("click", async () => {
            console.log("Admin login clicked");
            const msg = document.getElementById("login-msg"); msg.classList.add("hidden");
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            try {
                const res = await fetch(`${API}/api/login`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok && data.user && data.user.role === "admin") {
                    token = data.access_token;
                    localStorage.setItem("sawa_token", token);
                    localStorage.setItem("sawa_user", JSON.stringify(data.user));
                    showPanel();
                } else {
                    msg.innerText = data.user ? "Not an admin account" : (data.detail || "Login failed");
                    msg.classList.remove("hidden");
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                alert("Fetch Error: " + err);
            }
        });

        document.getElementById("create-btn").addEventListener("click", async () => {
            const msg = document.getElementById("create-msg"); msg.classList.add("hidden");
            const email = document.getElementById("new-email").value;
            const phone = document.getElementById("new-phone").value;
            const pass = document.getElementById("new-password").value;
            if(!email || !pass) { msg.innerText = "Email and Password are required."; msg.className = "text-sm mt-3 text-red-500"; msg.classList.remove("hidden"); return; }
            const res = await fetch(`${API}/api/admin/users?token=${token}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password: pass, phone_number: phone })
            });
            const data = await res.json();
            if (res.ok) {
                msg.innerText = `Account ${data.user.email} provisioned successfully.`;
                msg.className = "text-sm mt-3 text-green-600 font-medium"; msg.classList.remove("hidden");
                document.getElementById("new-email").value = ""; document.getElementById("new-phone").value = ""; document.getElementById("new-password").value = "";
                loadUsers();
            } else {
                msg.innerText = data.detail || "Failed to create user."; msg.className = "text-sm mt-3 text-red-500"; msg.classList.remove("hidden");
            }
        });

        async function toggleUser(id) {
            await fetch(`${API}/api/admin/users/${id}/toggle?token=${token}`, { method: "POST" });
            loadUsers();
        }

        async function loadUsers() {
            const res = await fetch(`${API}/api/admin/users?token=${token}`);
            const data = await res.json();
            const tbody = document.getElementById("users-table");
            tbody.innerHTML = "";
            let total = 0, active = 0, suspended = 0;
            data.users.forEach(u => {
                if(u.role === 'admin') return;
                total++; if(u.is_active) active++; else suspended++;
                const tr = document.createElement("tr");
                tr.className = "bg-white hover:bg-slate-50 transition";
                const statusBadge = u.is_active ? '<span class="px-2 py-1 text-xs font-bold rounded-full bg-green-100 text-green-800">ACTIVE</span>' : '<span class="px-2 py-1 text-xs font-bold rounded-full bg-red-100 text-red-800">SUSPENDED</span>';
                const actionBtn = u.is_active ? `<button onclick="toggleUser(${u.id})" class="text-red-600 hover:text-red-800 font-medium text-xs">Suspend Access</button>` : `<button onclick="toggleUser(${u.id})" class="text-green-600 hover:text-green-800 font-medium text-xs">Restore Access</button>`;
                tr.innerHTML = `<td class="px-6 py-4 font-mono text-slate-500">#SG-${String(u.id).padStart(4, '0')}</td><td class="px-6 py-4 font-medium text-slate-900">${u.email}</td><td class="px-6 py-4 text-slate-600">${u.phone_number || '—'}</td><td class="px-6 py-4">${statusBadge}</td><td class="px-6 py-4 text-right">${actionBtn}</td>`;
                tbody.appendChild(tr);
            });
            document.getElementById("stat-total").innerText = total;
            document.getElementById("stat-active").innerText = active;
            document.getElementById("stat-suspended").innerText = suspended;
            if(total === 0) tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">No customers found. Provision your first customer above.</td></tr>';
        }

        function showPanel() {
            loginSec.classList.add("hidden"); panelSec.classList.remove("hidden");
            document.getElementById("admin-email").innerText = localStorage.getItem("sawa_user") || "admin";
            loadUsers();
        }

        document.getElementById("logout-btn").addEventListener("click", () => { localStorage.clear(); location.reload(); });
    </script>
</body>
</html>
