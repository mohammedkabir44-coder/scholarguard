<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarGuard - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-3xl bg-gray-800 shadow-xl rounded-xl p-8 space-y-6 my-8">
        <div class="text-center border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-purple-400">🛡️ ScholarGuard Admin</h1>
            <p class="text-gray-400 mt-1">Commercial Control Panel</p>
        </div>

        <div id="admin-login" class="space-y-4 max-w-sm mx-auto">
            <h2 class="text-xl font-semibold text-center">Admin Login</h2>
            <input type="email" id="email" placeholder="Admin email" class="w-full p-3 border rounded-lg bg-gray-700 border-gray-600 focus:ring-2 focus:ring-purple-500 outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 border rounded-lg bg-gray-700 border-gray-600 focus:ring-2 focus:ring-purple-500 outline-none">
            <button id="login-btn" class="w-full bg-purple-600 text-white py-3 rounded-lg font-bold hover:bg-purple-700 transition">Login as Admin</button>
            <p id="login-msg" class="text-center text-sm text-red-400 hidden"></p>
        </div>

        <div id="admin-panel" class="space-y-6 hidden">
            <div class="flex justify-between items-center bg-purple-900 p-3 rounded-lg">
                <span class="text-purple-200 font-medium">Logged in as <b id="admin-email"></b></span>
                <button id="logout-btn" class="text-xs text-red-400 underline">Logout</button>
            </div>

            <div class="bg-gray-700 p-4 rounded-lg space-y-3">
                <h2 class="text-lg font-semibold text-green-400">➕ Create Customer Account</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="email" id="new-email" placeholder="Customer email" class="p-3 rounded-lg bg-gray-600 border border-gray-500 outline-none">
                    <input type="text" id="new-password" placeholder="Password" class="p-3 rounded-lg bg-gray-600 border border-gray-500 outline-none">
                    <button id="create-btn" class="bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">Create User</button>
                </div>
                <p id="create-msg" class="text-sm text-green-400 hidden"></p>
            </div>

            <div>
                <h2 class="text-xl font-semibold border-b border-gray-700 pb-2 mb-4">👥 All Users & Access Control</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-400 uppercase bg-gray-700">
                            <tr>
                                <th class="px-4 py-3">Email</th>
                                <th class="px-4 py-3">Role</th>
                                <th class="px-4 py-3">Status</th>
                                <th class="px-4 py-3">Action</th>
                            </tr>
                        </thead>
                        <tbody id="users-table"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = "https://scholarguard.onrender.com";
        let token = localStorage.getItem("sg_admin_token");

        const loginSec = document.getElementById("admin-login");
        const panelSec = document.getElementById("admin-panel");

        if (token) showPanel();

        document.getElementById("login-btn").addEventListener("click", async () => {
            const msg = document.getElementById("login-msg");
            msg.classList.add("hidden");
            const res = await fetch(`${API}/api/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: document.getElementById("email").value, password: document.getElementById("password").value })
            });
            const data = await res.json();
            if (res.ok && data.user.role === "admin") {
                token = data.access_token;
                localStorage.setItem("sg_admin_token", token);
                showPanel();
            } else {
                msg.innerText = data.user ? "Not an admin account" : (data.detail || "Login failed");
                msg.classList.remove("hidden");
            }
        });

        document.getElementById("create-btn").addEventListener("click", async () => {
            const msg = document.getElementById("create-msg");
            msg.classList.add("hidden");
            const res = await fetch(`${API}/api/admin/users?token=${token}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: document.getElementById("new-email").value, password: document.getElementById("new-password").value })
            });
            const data = await res.json();
            if (res.ok) {
                msg.innerText = `Account created for ${data.user.email} ✅`;
                msg.classList.remove("hidden");
                document.getElementById("new-email").value = "";
                document.getElementById("new-password").value = "";
                loadUsers();
            } else {
                msg.innerText = data.detail || "Failed";
                msg.className = "text-sm text-red-400";
                msg.classList.remove("hidden");
            }
        });

        async function toggleUser(id) {
            await fetch(`${API}/api/admin/users/${id}/toggle?token=${token}`, { method: "POST" });
            loadUsers();
        }

        async function loadUsers() {
            const res = await fetch(`${API}/api/admin/users?token=${token}`);
            const data = await res.json();
            const tbody = document.getElementById("users-table");
            tbody.innerHTML = "";
            data.users.forEach(u => {
                const tr = document.createElement("tr");
                tr.className = "bg-gray-800 border-b border-gray-700";
                const badge = u.is_active
                    ? '<span class="bg-green-900 text-green-300 px-2 py-1 rounded-full text-xs font-bold">ACTIVE</span>'
                    : '<span class="bg-red-900 text-red-300 px-2 py-1 rounded-full text-xs font-bold">DISABLED</span>';
                const btn = u.role === "admin" ? '<span class="text-gray-500 text-xs">—</span>'
                    : (u.is_active
                        ? `<button onclick="toggleUser(${u.id})" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs font-bold">Deactivate</button>`
                        : `<button onclick="toggleUser(${u.id})" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-xs font-bold">Activate</button>`);
                tr.innerHTML = `<td class="px-4 py-3">${u.email}</td><td class="px-4 py-3 text-gray-400">${u.role}</td><td class="px-4 py-3">${badge}</td><td class="px-4 py-3">${btn}</td>`;
                tbody.appendChild(tr);
            });
        }

        function showPanel() {
            loginSec.classList.add("hidden");
            panelSec.classList.remove("hidden");
            document.getElementById("admin-email").innerText = localStorage.getItem("sg_admin_email") || "admin";
            loadUsers();
        }

        document.getElementById("logout-btn").addEventListener("click", () => {
            localStorage.removeItem("sg_admin_token");
            location.reload();
        });
    </script>
</body>
</html>
